name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Validate rules (sigma check, all validators)
        run: sigma check --fail-on-issues rules/
      - name: Test rules against samples
        run: pytest -v
      - name: Coverage table is up to date
        run: python -m detlab.coverage --check
