title: SSH Failed Password
id: ea03d2ae-25e6-4218-9320-dac4ada03533
name: ssh_failed_password
status: experimental
description: |
  A single failed SSH password login. On its own this is noise, which is why
  its level is informational; it exists as the building block for the
  brute-force and password-spraying correlations. Matches both existing and
  non-existent users ("Failed password for invalid user ...").
author: defamp
date: 2026-09-28
logsource:
  product: linux
  service: auth
detection:
  selection:
    program: sshd
    message|startswith: 'Failed password for '
  condition: selection
fields:
  - src_ip
  - user
falsepositives:
  - Users mistyping their password
level: informational
tags:
  - attack.credential-access
  - attack.t1110.001
