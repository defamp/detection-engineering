title: SSH Password Spraying From Single Source
id: 5ddc4c27-cbef-4ed3-8e60-9778ff76b238
status: experimental
description: |
  Failed SSH passwords for five or more distinct usernames from the same
  source IP within ten minutes. Spraying tries one common password against
  many accounts to stay under per-account lockout, so it counts distinct
  users rather than attempts.
author: defamp
date: 2026-09-28
correlation:
  type: value_count
  rules:
    - ssh_failed_password
  group-by:
    - src_ip
  timespan: 10m
  condition:
    field: user
    gte: 5
falsepositives:
  - A jump host or NAT gateway shared by many users who mistype passwords
level: high
tags:
  - attack.credential-access
  - attack.t1110.003
