# Synthetic lines in raw log format; IPs are from RFC 5737 documentation ranges.
cases:
  - description: crontab replaced (crontab file or crontab -e save)
    expect: match
    raw: 'Sep 28 12:00:00 web1 crontab[4102]: (bob) REPLACE (bob)'
  - description: root edit session saved
    expect: match
    raw: 'Sep 28 12:00:00 web1 crontab[4102]: (root) END EDIT (root)'
  - description: crontab listed
    expect: no_match
    raw: 'Sep 28 12:00:00 web1 crontab[4102]: (bob) LIST (bob)'
  - description: cron daemon running a job
    expect: no_match
    raw: 'Sep 28 12:00:00 web1 CRON[5000]: (root) CMD (run-parts /etc/cron.hourly)'
