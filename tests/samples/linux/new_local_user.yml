# Synthetic lines in raw log format; IPs are from RFC 5737 documentation ranges.
wazuh_rule: 100120
cases:
  - description: useradd creates an account
    expect: match
    raw: 'Sep 28 12:00:00 web1 useradd[2451]: new user: name=backdoor, UID=1001, GID=1001, home=/home/backdoor, shell=/bin/bash, from=/dev/pts/0'
  - description: useradd creating the matching group line only
    expect: no_match
    raw: 'Sep 28 12:00:00 web1 useradd[2451]: new group: name=backdoor, GID=1001'
  - description: unrelated passwd change
    expect: no_match
    raw: 'Sep 28 12:00:00 web1 passwd[2600]: pam_unix(passwd:chauthtok): password changed for alice'
