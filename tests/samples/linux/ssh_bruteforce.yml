# Synthetic lines in raw log format; IPs are from RFC 5737 documentation ranges.
wazuh_rule: 100111
cases:
  - description: 6 failures from one IP in 25 seconds
    expect: alert
    groups: [[203.0.113.7]]
    raw:
      - 'Sep 28 10:00:00 web1 sshd[811]: Failed password for root from 203.0.113.7 port 50001 ssh2'
      - 'Sep 28 10:00:05 web1 sshd[811]: Failed password for root from 203.0.113.7 port 50002 ssh2'
      - 'Sep 28 10:00:10 web1 sshd[811]: Failed password for root from 203.0.113.7 port 50003 ssh2'
      - 'Sep 28 10:00:15 web1 sshd[811]: Failed password for root from 203.0.113.7 port 50004 ssh2'
      - 'Sep 28 10:00:20 web1 sshd[811]: Failed password for root from 203.0.113.7 port 50005 ssh2'
      - 'Sep 28 10:00:25 web1 sshd[811]: Failed password for root from 203.0.113.7 port 50006 ssh2'
  - description: 5 failures spread over 4 minutes (slow guessing stays under the threshold)
    wazuh_skip: "wazuh correlates on analysis time; logtest processes every line at once, so time gaps can't be reproduced (covered by the Python engine)"
    expect: no_alert
    raw:
      - 'Sep 28 10:00:00 web1 sshd[811]: Failed password for root from 203.0.113.7 port 50001 ssh2'
      - 'Sep 28 10:01:00 web1 sshd[811]: Failed password for root from 203.0.113.7 port 50002 ssh2'
      - 'Sep 28 10:02:00 web1 sshd[811]: Failed password for root from 203.0.113.7 port 50003 ssh2'
      - 'Sep 28 10:03:00 web1 sshd[811]: Failed password for root from 203.0.113.7 port 50004 ssh2'
      - 'Sep 28 10:04:00 web1 sshd[811]: Failed password for root from 203.0.113.7 port 50005 ssh2'
  - description: 5 failures within a minute but from 5 different IPs (grouped per source)
    expect: no_alert
    raw:
      - 'Sep 28 10:00:00 web1 sshd[811]: Failed password for bob from 198.51.100.1 port 1 ssh2'
      - 'Sep 28 10:00:05 web1 sshd[811]: Failed password for bob from 198.51.100.2 port 1 ssh2'
      - 'Sep 28 10:00:10 web1 sshd[811]: Failed password for bob from 198.51.100.3 port 1 ssh2'
      - 'Sep 28 10:00:15 web1 sshd[811]: Failed password for bob from 198.51.100.4 port 1 ssh2'
      - 'Sep 28 10:00:20 web1 sshd[811]: Failed password for bob from 198.51.100.5 port 1 ssh2'
  - description: successful logins do not count as failures
    expect: no_alert
    raw:
      - 'Sep 28 10:00:00 web1 sshd[811]: Accepted publickey for deploy from 192.0.2.10 port 1 ssh2'
      - 'Sep 28 10:00:05 web1 sshd[811]: Accepted publickey for deploy from 192.0.2.10 port 2 ssh2'
      - 'Sep 28 10:00:10 web1 sshd[811]: Accepted publickey for deploy from 192.0.2.10 port 3 ssh2'
      - 'Sep 28 10:00:15 web1 sshd[811]: Accepted publickey for deploy from 192.0.2.10 port 4 ssh2'
      - 'Sep 28 10:00:20 web1 sshd[811]: Accepted publickey for deploy from 192.0.2.10 port 5 ssh2'
