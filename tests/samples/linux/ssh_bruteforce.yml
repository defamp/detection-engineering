# Synthetic events. IPs are from RFC 5737 documentation ranges.
cases:
  - description: 6 failures from one IP in 25 seconds
    expect: alert
    groups: [[203.0.113.7]]
    events:
      - {timestamp: "2026-09-28T10:00:00", program: sshd, message: "Failed password for root from 203.0.113.7 port 50001 ssh2", user: root, src_ip: 203.0.113.7}
      - {timestamp: "2026-09-28T10:00:05", program: sshd, message: "Failed password for root from 203.0.113.7 port 50002 ssh2", user: root, src_ip: 203.0.113.7}
      - {timestamp: "2026-09-28T10:00:10", program: sshd, message: "Failed password for root from 203.0.113.7 port 50003 ssh2", user: root, src_ip: 203.0.113.7}
      - {timestamp: "2026-09-28T10:00:15", program: sshd, message: "Failed password for root from 203.0.113.7 port 50004 ssh2", user: root, src_ip: 203.0.113.7}
      - {timestamp: "2026-09-28T10:00:20", program: sshd, message: "Failed password for root from 203.0.113.7 port 50005 ssh2", user: root, src_ip: 203.0.113.7}
      - {timestamp: "2026-09-28T10:00:25", program: sshd, message: "Failed password for root from 203.0.113.7 port 50006 ssh2", user: root, src_ip: 203.0.113.7}
  - description: 5 failures spread over 4 minutes (slow guessing stays under the threshold)
    expect: no_alert
    events:
      - {timestamp: "2026-09-28T10:00:00", program: sshd, message: "Failed password for root from 203.0.113.7 port 50001 ssh2", user: root, src_ip: 203.0.113.7}
      - {timestamp: "2026-09-28T10:01:00", program: sshd, message: "Failed password for root from 203.0.113.7 port 50002 ssh2", user: root, src_ip: 203.0.113.7}
      - {timestamp: "2026-09-28T10:02:00", program: sshd, message: "Failed password for root from 203.0.113.7 port 50003 ssh2", user: root, src_ip: 203.0.113.7}
      - {timestamp: "2026-09-28T10:03:00", program: sshd, message: "Failed password for root from 203.0.113.7 port 50004 ssh2", user: root, src_ip: 203.0.113.7}
      - {timestamp: "2026-09-28T10:04:00", program: sshd, message: "Failed password for root from 203.0.113.7 port 50005 ssh2", user: root, src_ip: 203.0.113.7}
  - description: 5 failures within a minute but from 5 different IPs (grouped per source)
    expect: no_alert
    events:
      - {timestamp: "2026-09-28T10:00:00", program: sshd, message: "Failed password for bob from 198.51.100.1 port 1 ssh2", user: bob, src_ip: 198.51.100.1}
      - {timestamp: "2026-09-28T10:00:05", program: sshd, message: "Failed password for bob from 198.51.100.2 port 1 ssh2", user: bob, src_ip: 198.51.100.2}
      - {timestamp: "2026-09-28T10:00:10", program: sshd, message: "Failed password for bob from 198.51.100.3 port 1 ssh2", user: bob, src_ip: 198.51.100.3}
      - {timestamp: "2026-09-28T10:00:15", program: sshd, message: "Failed password for bob from 198.51.100.4 port 1 ssh2", user: bob, src_ip: 198.51.100.4}
      - {timestamp: "2026-09-28T10:00:20", program: sshd, message: "Failed password for bob from 198.51.100.5 port 1 ssh2", user: bob, src_ip: 198.51.100.5}
  - description: successful logins do not count as failures
    expect: no_alert
    events:
      - {timestamp: "2026-09-28T10:00:00", program: sshd, message: "Accepted publickey for deploy from 192.0.2.10 port 1 ssh2", user: deploy, src_ip: 192.0.2.10}
      - {timestamp: "2026-09-28T10:00:05", program: sshd, message: "Accepted publickey for deploy from 192.0.2.10 port 2 ssh2", user: deploy, src_ip: 192.0.2.10}
      - {timestamp: "2026-09-28T10:00:10", program: sshd, message: "Accepted publickey for deploy from 192.0.2.10 port 3 ssh2", user: deploy, src_ip: 192.0.2.10}
      - {timestamp: "2026-09-28T10:00:15", program: sshd, message: "Accepted publickey for deploy from 192.0.2.10 port 4 ssh2", user: deploy, src_ip: 192.0.2.10}
      - {timestamp: "2026-09-28T10:00:20", program: sshd, message: "Accepted publickey for deploy from 192.0.2.10 port 5 ssh2", user: deploy, src_ip: 192.0.2.10}
