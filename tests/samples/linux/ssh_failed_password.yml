# Synthetic lines in /var/log/auth.log format. IPs are from RFC 5737 documentation ranges.
wazuh_rule: [100110, 100114]
cases:
  - description: failed password for an existing user
    expect: match
    raw: "Sep 28 10:00:00 web1 sshd[811]: Failed password for root from 203.0.113.7 port 51234 ssh2"
  - description: failed password for a non-existent user
    expect: match
    raw: "Sep 28 10:00:01 web1 sshd[811]: Failed password for invalid user admin from 203.0.113.7 port 51240 ssh2"
  - description: failed password from an IPv6 source
    expect: match
    raw: "Sep 28 10:00:01 web1 sshd[811]: Failed password for root from 2001:db8::7 port 51241 ssh2"
  - description: successful login
    expect: no_match
    raw: "Sep 28 10:00:02 web1 sshd[812]: Accepted password for alice from 198.51.100.4 port 40022 ssh2"
  - description: same text from a different program is not an sshd failure
    expect: no_match
    raw: "Sep 28 10:00:03 web1 login[900]: Failed password for alice"
