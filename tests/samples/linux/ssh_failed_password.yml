# Synthetic events. IPs are from RFC 5737 documentation ranges.
cases:
  - description: failed password for an existing user
    expect: match
    event: {program: sshd, message: "Failed password for root from 203.0.113.7 port 51234 ssh2", user: root, src_ip: 203.0.113.7}
  - description: failed password for a non-existent user
    expect: match
    event: {program: sshd, message: "Failed password for invalid user admin from 203.0.113.7 port 51240 ssh2", user: admin, src_ip: 203.0.113.7}
  - description: successful login
    expect: no_match
    event: {program: sshd, message: "Accepted password for alice from 198.51.100.4 port 40022 ssh2", user: alice, src_ip: 198.51.100.4}
  - description: same text from a different program is not an sshd failure
    expect: no_match
    event: {program: sudo, message: "Failed password for alice", user: alice}
