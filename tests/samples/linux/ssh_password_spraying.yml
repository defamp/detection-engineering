# Synthetic lines in raw log format; IPs are from RFC 5737 documentation ranges.
wazuh_rule: 100112
cases:
  - description: one IP tries 5 different users within 4 minutes
    expect: alert
    groups: [[203.0.113.50]]
    raw:
      - 'Sep 28 11:00:00 web1 sshd[811]: Failed password for alice from 203.0.113.50 port 1 ssh2'
      - 'Sep 28 11:01:00 web1 sshd[811]: Failed password for bob from 203.0.113.50 port 2 ssh2'
      - 'Sep 28 11:02:00 web1 sshd[811]: Failed password for invalid user carol from 203.0.113.50 port 3 ssh2'
      - 'Sep 28 11:03:00 web1 sshd[811]: Failed password for dave from 203.0.113.50 port 4 ssh2'
      - 'Sep 28 11:04:00 web1 sshd[811]: Failed password for erin from 203.0.113.50 port 5 ssh2'
  - description: many failures but always the same user (that is brute force, not spraying)
    expect: no_alert
    raw:
      - 'Sep 28 11:00:00 web1 sshd[811]: Failed password for root from 203.0.113.50 port 1 ssh2'
      - 'Sep 28 11:00:10 web1 sshd[811]: Failed password for root from 203.0.113.50 port 2 ssh2'
      - 'Sep 28 11:00:20 web1 sshd[811]: Failed password for root from 203.0.113.50 port 3 ssh2'
      - 'Sep 28 11:00:30 web1 sshd[811]: Failed password for root from 203.0.113.50 port 4 ssh2'
      - 'Sep 28 11:00:40 web1 sshd[811]: Failed password for root from 203.0.113.50 port 5 ssh2'
      - 'Sep 28 11:00:50 web1 sshd[811]: Failed password for root from 203.0.113.50 port 6 ssh2'
  - description: 5 distinct users but spread over more than 10 minutes
    wazuh_skip: "wazuh correlates on analysis time; logtest processes every line at once, so time gaps can't be reproduced (covered by the Python engine)"
    expect: no_alert
    raw:
      - 'Sep 28 11:00:00 web1 sshd[811]: Failed password for alice from 203.0.113.50 port 1 ssh2'
      - 'Sep 28 11:04:00 web1 sshd[811]: Failed password for bob from 203.0.113.50 port 2 ssh2'
      - 'Sep 28 11:08:00 web1 sshd[811]: Failed password for carol from 203.0.113.50 port 3 ssh2'
      - 'Sep 28 11:12:00 web1 sshd[811]: Failed password for dave from 203.0.113.50 port 4 ssh2'
      - 'Sep 28 11:16:00 web1 sshd[811]: Failed password for erin from 203.0.113.50 port 5 ssh2'
