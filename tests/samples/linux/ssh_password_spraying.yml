# Synthetic events. IPs are from RFC 5737 documentation ranges.
cases:
  - description: one IP tries 5 different users within 4 minutes
    expect: alert
    groups: [[203.0.113.50]]
    events:
      - {timestamp: "2026-09-28T11:00:00", program: sshd, message: "Failed password for alice from 203.0.113.50 port 1 ssh2", user: alice, src_ip: 203.0.113.50}
      - {timestamp: "2026-09-28T11:01:00", program: sshd, message: "Failed password for bob from 203.0.113.50 port 2 ssh2", user: bob, src_ip: 203.0.113.50}
      - {timestamp: "2026-09-28T11:02:00", program: sshd, message: "Failed password for invalid user carol from 203.0.113.50 port 3 ssh2", user: carol, src_ip: 203.0.113.50}
      - {timestamp: "2026-09-28T11:03:00", program: sshd, message: "Failed password for dave from 203.0.113.50 port 4 ssh2", user: dave, src_ip: 203.0.113.50}
      - {timestamp: "2026-09-28T11:04:00", program: sshd, message: "Failed password for erin from 203.0.113.50 port 5 ssh2", user: erin, src_ip: 203.0.113.50}
  - description: many failures but always the same user (that is brute force, not spraying)
    expect: no_alert
    events:
      - {timestamp: "2026-09-28T11:00:00", program: sshd, message: "Failed password for root from 203.0.113.50 port 1 ssh2", user: root, src_ip: 203.0.113.50}
      - {timestamp: "2026-09-28T11:00:10", program: sshd, message: "Failed password for root from 203.0.113.50 port 2 ssh2", user: root, src_ip: 203.0.113.50}
      - {timestamp: "2026-09-28T11:00:20", program: sshd, message: "Failed password for root from 203.0.113.50 port 3 ssh2", user: root, src_ip: 203.0.113.50}
      - {timestamp: "2026-09-28T11:00:30", program: sshd, message: "Failed password for root from 203.0.113.50 port 4 ssh2", user: root, src_ip: 203.0.113.50}
      - {timestamp: "2026-09-28T11:00:40", program: sshd, message: "Failed password for root from 203.0.113.50 port 5 ssh2", user: root, src_ip: 203.0.113.50}
      - {timestamp: "2026-09-28T11:00:50", program: sshd, message: "Failed password for root from 203.0.113.50 port 6 ssh2", user: root, src_ip: 203.0.113.50}
  - description: 5 distinct users but spread over more than 10 minutes
    expect: no_alert
    events:
      - {timestamp: "2026-09-28T11:00:00", program: sshd, message: "Failed password for alice from 203.0.113.50 port 1 ssh2", user: alice, src_ip: 203.0.113.50}
      - {timestamp: "2026-09-28T11:04:00", program: sshd, message: "Failed password for bob from 203.0.113.50 port 2 ssh2", user: bob, src_ip: 203.0.113.50}
      - {timestamp: "2026-09-28T11:08:00", program: sshd, message: "Failed password for carol from 203.0.113.50 port 3 ssh2", user: carol, src_ip: 203.0.113.50}
      - {timestamp: "2026-09-28T11:12:00", program: sshd, message: "Failed password for dave from 203.0.113.50 port 4 ssh2", user: dave, src_ip: 203.0.113.50}
      - {timestamp: "2026-09-28T11:16:00", program: sshd, message: "Failed password for erin from 203.0.113.50 port 5 ssh2", user: erin, src_ip: 203.0.113.50}
