# Synthetic lines in raw log format; IPs are from RFC 5737 documentation ranges.
cases:
  - description: usermod -aG sudo
    expect: match
    raw: 'Sep 28 12:00:00 web1 usermod[3001]: add ''backdoor'' to group ''sudo'''
  - description: usermod shadow group entry for wheel
    expect: match
    raw: 'Sep 28 12:00:00 web1 usermod[3001]: add ''backdoor'' to shadow group ''wheel'''
  - description: gpasswd -a user sudo
    expect: match
    raw: 'Sep 28 12:00:00 web1 gpasswd[3002]: user backdoor added by root to group sudo'
  - description: added to an unprivileged group
    expect: no_match
    raw: 'Sep 28 12:00:00 web1 usermod[3001]: add ''alice'' to group ''docker-readers'''
  - description: group name that only starts with sudo
    expect: no_match
    raw: 'Sep 28 12:00:00 web1 usermod[3001]: add ''alice'' to group ''sudoers-audit'''
