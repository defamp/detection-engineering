cases:
  - description: usermod -aG sudo
    expect: match
    event: {program: usermod, message: "add 'backdoor' to group 'sudo'"}
  - description: usermod shadow group entry for wheel
    expect: match
    event: {program: usermod, message: "add 'backdoor' to shadow group 'wheel'"}
  - description: gpasswd -a user sudo
    expect: match
    event: {program: gpasswd, message: "user backdoor added by root to group sudo"}
  - description: added to an unprivileged group
    expect: no_match
    event: {program: usermod, message: "add 'alice' to group 'docker-readers'"}
  - description: group name that only starts with sudo
    expect: no_match
    event: {program: usermod, message: "add 'alice' to group 'sudoers-audit'"}
