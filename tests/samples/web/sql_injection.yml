# Synthetic lines in raw log format; IPs are from RFC 5737 documentation ranges.
wazuh_rule: 100160
cases:
  - description: UNION SELECT with + as space
    expect: match
    raw: '203.0.113.9 - - [28/Sep/2026:10:00:00 +0000] "GET /product.php?id=1+UNION+SELECT+username,password+FROM+users HTTP/1.1" 200 512 "-" "Mozilla/5.0"'
  - description: URL-encoded tautology
    expect: match
    raw: '203.0.113.9 - - [28/Sep/2026:10:00:01 +0000] "GET /login.php?user=admin%27%20OR%201%3D1-- HTTP/1.1" 200 512 "-" "Mozilla/5.0"'
  - description: time-based probe
    expect: match
    raw: '203.0.113.9 - - [28/Sep/2026:10:00:02 +0000] "GET /item?id=5%20AND%20SLEEP(5) HTTP/1.1" 200 512 "-" "Mozilla/5.0"'
  - description: inline-comment evasion of spaces
    expect: match
    raw: '203.0.113.9 - - [28/Sep/2026:10:00:03 +0000] "GET /item?id=-1/**/union/**/select/**/1,2,3 HTTP/1.1" 200 512 "-" "Mozilla/5.0"'
  - description: normal search containing the words union and select
    expect: no_match
    raw: '203.0.113.9 - - [28/Sep/2026:10:00:04 +0000] "GET /search?q=credit+union+account+selection HTTP/1.1" 200 512 "-" "Mozilla/5.0"'
  - description: normal numeric parameter
    expect: no_match
    raw: '203.0.113.9 - - [28/Sep/2026:10:00:05 +0000] "GET /product.php?id=42&sort=price HTTP/1.1" 200 512 "-" "Mozilla/5.0"'
